<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sarqt — страница не найдена</title>
<style>
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#FEF8F1;color:#212121;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  h1{font-size:clamp(2rem,5vw,3rem);margin:0 0 16px}
  p{color:#5b5b5b;font-size:1.0625rem;margin:0 0 32px;max-width:480px}
  a{display:inline-block;padding:14px 28px;background:#EEC200;color:#212121;text-decoration:none;border-radius:12px;font-weight:700}
  a:hover{background:#d4ae00}
</style>
</head>
<body>
<div>
<h1>404 — страница не найдена</h1>
<p>Такой страницы нет. sarqt — одностраничное приложение с hash-роутингом; возможно, ссылка устарела.</p>
<a href="./">На главную →</a>
</div>
<script>
  // SPA fallback: GH Pages отдаёт 404.html на любой неизвестный путь.
  // Редирект на корень — дальше hash-роутер приложения разберётся.
  if (location.pathname !== '/' && !location.pathname.endsWith('/index.html')) {
    const base = location.pathname.replace(/[^\/]+$/, '');
    setTimeout(() => { location.replace(base || '/'); }, 1500);
  }
</script>
</body>
</html>
